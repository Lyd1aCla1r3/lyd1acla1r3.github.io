<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scope of Expertise | Lydia Pedersen × Keysight</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="../css/styles.css?v=1.1">
  <link rel="stylesheet" href="../css/keysight.css?v=1.3">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <style>
    /* --- Page Header --- */
    .ks-header {
      padding-top: calc(var(--ks-nav-height) + var(--ks-space-2xl));
      margin-bottom: 36px;
      text-align: center;
    }

    /* --- Puzzle Wrapper --- */
    .cv-puzzle-wrapper {
      max-width: 800px;
      margin: 0 auto 8px;
    }

    .cv-puzzle {
      width: 100%;
      height: auto;
      display: block;
    }

    /* --- Column Group States --- */
    .cv-col {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s var(--ks-ease);
    }

    .cv-col.is-available {
      pointer-events: auto;
      cursor: pointer;
    }

    .cv-col.is-active {
      opacity: 1;
      pointer-events: none;
    }

    /* Breathing pulse for available columns */
    @keyframes cv-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.8; }
    }

    .cv-col.is-available {
      animation: cv-pulse 2.5s ease-in-out infinite;
    }

    /* --- Puzzle Piece Base --- */
    .cv-piece {
      stroke-width: 1.5;
      transition: fill 0.5s var(--ks-ease), stroke 0.5s var(--ks-ease), filter 0.5s var(--ks-ease);
    }

    /* --- Column Color Schemes --- */

    /* Gold — faded */
    .cv-col[data-col="1"] .cv-piece {
      fill: rgba(248,236,208,0.35);
      stroke: rgba(184,144,40,0.3);
    }
    /* Gold — hover */
    .cv-col[data-col="1"].is-available:hover .cv-piece {
      fill: rgba(248,236,208,0.6);
      stroke: rgba(184,144,40,0.5);
    }
    /* Gold — active */
    .cv-col[data-col="1"].is-active .cv-piece {
      fill: #f8ecd0;
      stroke: #a07b20;
      filter: drop-shadow(0 1px 6px rgba(184,144,40,0.3));
    }

    /* Peach — faded */
    .cv-col[data-col="2"] .cv-piece {
      fill: rgba(246,228,216,0.35);
      stroke: rgba(192,136,104,0.3);
    }
    /* Peach — hover */
    .cv-col[data-col="2"].is-available:hover .cv-piece {
      fill: rgba(246,228,216,0.6);
      stroke: rgba(192,136,104,0.5);
    }
    /* Peach — active */
    .cv-col[data-col="2"].is-active .cv-piece {
      fill: #f6e4d8;
      stroke: #85573c;
      filter: drop-shadow(0 1px 6px rgba(192,136,104,0.3));
    }

    /* Rose Gold — faded */
    .cv-col[data-col="3"] .cv-piece {
      fill: rgba(244,224,227,0.35);
      stroke: rgba(183,110,121,0.3);
    }
    /* Rose Gold — hover */
    .cv-col[data-col="3"].is-available:hover .cv-piece {
      fill: rgba(244,224,227,0.6);
      stroke: rgba(183,110,121,0.5);
    }
    /* Rose Gold — active */
    .cv-col[data-col="3"].is-active .cv-piece {
      fill: #f4e0e3;
      stroke: #81404a;
      filter: drop-shadow(0 1px 6px rgba(183,110,121,0.3));
    }

    /* Dark Pink — faded */
    .cv-col[data-col="4"] .cv-piece {
      fill: rgba(242,209,214,0.35);
      stroke: rgba(166,93,108,0.3);
    }
    /* Dark Pink — hover */
    .cv-col[data-col="4"].is-available:hover .cv-piece {
      fill: rgba(242,209,214,0.6);
      stroke: rgba(166,93,108,0.5);
    }
    /* Dark Pink — active */
    .cv-col[data-col="4"].is-active .cv-piece {
      fill: #f2d1d6;
      stroke: #7d4450;
      filter: drop-shadow(0 1px 6px rgba(166,93,108,0.3));
    }

    /* --- SVG Labels --- */
    .cv-label-text {
      font-family: 'Outfit', -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      fill: var(--ks-text-muted);
      pointer-events: none;
      transition: fill 0.5s var(--ks-ease), font-weight 0.3s;
    }

    .cv-col[data-col="1"].is-active .cv-label-text { fill: #a07b20; font-weight: 600; }
    .cv-col[data-col="2"].is-active .cv-label-text { fill: #85573c; font-weight: 600; }
    .cv-col[data-col="3"].is-active .cv-label-text { fill: #81404a; font-weight: 600; }
    .cv-col[data-col="4"].is-active .cv-label-text { fill: #7d4450; font-weight: 600; }

    /* --- Hint Text --- */
    .cv-hint {
      text-align: center;
      color: var(--ks-text-muted);
      font-size: var(--ks-fs-section-label);
      font-style: italic;
      margin: 4px 0 20px;
      transition: opacity 0.5s var(--ks-ease);
    }
    .cv-hint.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* --- Text Card Stack --- */
    .cv-text-stack {
      max-width: 800px;
      margin: 0 auto 40px;
    }

    .cv-text-card {
      border-radius: 8px;
      border-left-width: 4px;
      border-left-style: solid;
      padding: 20px 24px;
      margin-bottom: 12px;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.5s var(--ks-ease), transform 0.5s var(--ks-ease);
    }

    .cv-text-card:last-child {
      margin-bottom: 0;
    }

    .cv-text-card.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .cv-text-card__title {
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--ks-fs-section-label);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .cv-text-card__body {
      font-size: var(--ks-fs-small);
      color: var(--ks-text-secondary);
      line-height: 1.65;
      margin: 0;
    }

    /* Card color variants — matching hub page active states */
    .cv-text-card--gold {
      background: rgba(248, 236, 208, 0.55);
      border-left-color: #a07b20;
    }
    .cv-text-card--gold .cv-text-card__title,
    .cv-text-card--gold .cv-text-card__body { color: #a07b20; }

    .cv-text-card--peach {
      background: rgba(246, 228, 216, 0.55);
      border-left-color: #85573c;
    }
    .cv-text-card--peach .cv-text-card__title,
    .cv-text-card--peach .cv-text-card__body { color: #85573c; }

    .cv-text-card--rose {
      background: rgba(244, 224, 227, 0.55);
      border-left-color: #81404a;
    }
    .cv-text-card--rose .cv-text-card__title,
    .cv-text-card--rose .cv-text-card__body { color: #81404a; }

    .cv-text-card--dark-pink {
      background: rgba(242, 209, 214, 0.55);
      border-left-color: #7d4450;
    }
    .cv-text-card--dark-pink .cv-text-card__title,
    .cv-text-card--dark-pink .cv-text-card__body { color: #7d4450; }

    /* --- Reset Button --- */
    .ks-translate-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 2.5rem;
      background: rgba(253, 248, 244, 0.95);
      border: 1px solid rgba(183, 110, 121, 0.3);
      border-radius: 30px;
      color: var(--ks-text-primary);
      font-size: var(--ks-fs-small);
      cursor: pointer;
      transition: all 300ms var(--ks-ease), opacity 500ms;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .ks-translate-btn:hover {
      border-color: #81404a;
      background: #ffffff;
    }

    /* --- Accessibility: Reduced Motion --- */
    @media (prefers-reduced-motion: reduce) {
      .cv-col {
        transition: none;
      }
      .cv-col.is-available {
        animation: none;
        opacity: 0.6;
      }
      .cv-piece {
        transition: none;
      }
      .cv-text-card {
        transition: none;
      }
      .cv-hint {
        transition: none;
      }
    }
  </style>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const cols = document.querySelectorAll('.cv-col');
      const textStack = document.getElementById('cvTextStack');
      const hint = document.getElementById('cvHint');
      const resetBtn = document.getElementById('reset-btn');
      let currentStep = 0;

      const steps = [
        {
          title: 'Pipeline Architecture',
          body: 'My experience developing production-grade AI workflows gave me direct insights into how computational patterns create physical-layer pressure. I have built training pipelines, inference services, and retrieval-augmented generation systems, and I understand which workloads create which bandwidth demands.',
          colorClass: 'cv-text-card--gold'
        },
        {
          title: 'Objectives and Limitations',
          body: 'My career in hardware validation put me on the physical side of this bottleneck, measuring where data degrades at the boundary between compute and interconnect. That diagnostic instinct translates directly into technical conversations with customers evaluating measurement solutions.',
          colorClass: 'cv-text-card--peach'
        },
        {
          title: 'Standards and Compliance',
          body: 'I have validated hardware against high-speed digital specifications across multiple organizations, including direct collaboration with standards bodies and measurement methodology committees. I understand these standards at the test-plan level because I have developed and executed hundreds of compliance test runs across their full specification lifecycles.',
          colorClass: 'cv-text-card--rose'
        },
        {
          title: 'Validation & Measurement',
          body: 'For fifteen years across four organizations, I configured benches, characterized devices, verified SI, and ran compliance tests. I understand the customer for the instruments and software that Keysight sells, because I was the customer. I am well-versed in the technical challenges and expectations of lab engineers, as well as the traits and skills that define the SEs they want to work with.',
          colorClass: 'cv-text-card--dark-pink'
        }
      ];

      function activateCol(index) {
        if (index !== currentStep) return;

        // Transition column from available to active
        cols[index].classList.remove('is-available');
        cols[index].classList.add('is-active');
        cols[index].setAttribute('aria-label', steps[index].title + '. Revealed.');
        cols[index].removeAttribute('tabindex');
        cols[index].setAttribute('role', 'img');

        // Hide hint on first click
        if (index === 0 && hint) {
          hint.classList.add('is-hidden');
        }

        // Create and prepend text card (newest always closest to puzzle)
        const card = document.createElement('div');
        card.className = 'cv-text-card ' + steps[index].colorClass;
        card.innerHTML =
          '<div class="cv-text-card__title">' + steps[index].title + '</div>' +
          '<p class="cv-text-card__body">' + steps[index].body + '</p>';
        textStack.prepend(card);

        // Trigger entrance animation on next frame
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            card.classList.add('is-visible');
          });
        });

        // Advance state
        currentStep++;

        if (currentStep === 1) {
          resetBtn.style.opacity = '1';
          resetBtn.style.pointerEvents = 'auto';
        }

        // Fade in next column after a short delay
        if (currentStep < cols.length) {
          setTimeout(() => {
            cols[currentStep].classList.add('is-available');
          }, 450);
        }
      }

      // Initialize: first column becomes available
      cols[0].classList.add('is-available');

      // Attach click and keyboard handlers to all columns
      cols.forEach((col, i) => {
        col.addEventListener('click', () => activateCol(i));
        col.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            activateCol(i);
          }
        });
      });

      // Reset logic
      resetBtn.addEventListener('click', () => {
        if (currentStep === 0) return;
        currentStep = 0;
        textStack.innerHTML = '';
        cols.forEach((col, i) => {
          col.classList.remove('is-active', 'is-available');
          col.setAttribute('aria-label', steps[i].title + '. Click to reveal.');
          col.setAttribute('tabindex', '0');
          col.removeAttribute('role');
          if (i === 0) col.classList.add('is-available');
        });
        if (hint) hint.classList.remove('is-hidden');
        resetBtn.style.opacity = '0';
        resetBtn.style.pointerEvents = 'none';
      });
    });
  </script>
</body>
</html>
